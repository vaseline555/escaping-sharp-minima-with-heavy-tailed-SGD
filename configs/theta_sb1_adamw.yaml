# Theta scalar broadcast (sb1) + AdamW
optimizer: adamw
betas: [0.9, 0.95]
eps: 1.0e-8
weight_decay: 0.1
lr_decay: linear
warmup_steps: 0
min_lr_frac: 0.0
cooldown_frac: 0.29
grad_clip: 1.0
theta_enabled: true
theta_alpha: 1.4
theta_scale: 0.5
theta_tail_prob: 0.9
theta_noise_stop_frac: 0.9
theta_rademacher: false
